[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuspilot-models"
version = "0.1.0"
description = "Provider-neutral model contracts and HTTP adapters for NexusPilot"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
