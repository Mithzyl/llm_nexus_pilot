[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuspilot-api"
version = "0.5.0"
description = "NexusPilot API and provider-neutral model response service"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "../../packages/models/src"]
testpaths = ["tests"]
markers = [
    "infrastructure: requires explicitly configured real MySQL or MinIO services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
