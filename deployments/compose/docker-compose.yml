services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexuspilot
      MYSQL_USER: nexuspilot
      MYSQL_PASSWORD: nexuspilot
      MYSQL_ROOT_PASSWORD: local-root-password-change-me
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unexuspilot", "-pnexuspilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexuspilot
      MINIO_ROOT_PASSWORD: local-development-secret-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn nexuspilot_api.main:app --app-dir src --host 0.0.0.0 --port 8000
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  mysql-data:
  minio-data:
