services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nexuspilot
      MYSQL_USER: nexuspilot
      MYSQL_PASSWORD: nexuspilot
      MYSQL_ROOT_PASSWORD: local-root-password-change-me
    ports:
      - "${NEXUSPILOT_MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unexuspilot", "-pnexuspilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexuspilot
      MINIO_ROOT_PASSWORD: local-development-secret-change-me
    ports:
      - "${NEXUSPILOT_MINIO_API_HOST_PORT:-9000}:9000"
      - "${NEXUSPILOT_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../apps/api/.env
    environment:
      # Container-to-container addresses override localhost values used by the host venv.
      NEXUSPILOT_DATABASE_URL: mysql+aiomysql://nexuspilot:nexuspilot@mysql:3306/nexuspilot
      NEXUSPILOT_MINIO_ENDPOINT: minio:9000
      NEXUSPILOT_MINIO_ACCESS_KEY: nexuspilot
      NEXUSPILOT_MINIO_SECRET_KEY: local-development-secret-change-me
    ports:
      - "${NEXUSPILOT_API_HOST_PORT:-8000}:8000"
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn nexuspilot_api.main:app --app-dir src --host 0.0.0.0 --port 8000
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  mysql-data:
  minio-data:
