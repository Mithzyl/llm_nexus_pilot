# Run with --env-file ../production/runtime/.env (from the repository root use full relative paths).
# Secrets live in private env files. Only Nginx publishes ports. Migrations are explicit one-off jobs.
name: nexuspilot

x-api: &api
  image: nexuspilot-api:${RELEASE_TAG:?Set RELEASE_TAG}
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=268435456,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 2g
  cpus: 2
  logging: &logs
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  mysql:
    image: nexuspilot-mysql:${RELEASE_TAG}
    build:
      context: ../..
      dockerfile: deployments/production/mysql.Dockerfile
    env_file: ["${DEPLOY_CONFIG_DIR:?Set DEPLOY_CONFIG_DIR}/mysql.env"]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [data]
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 256
    logging: *logs
    healthcheck:
      # The temporary initialization server only accepts sockets; wait for real TCP SQL.
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" --silent >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    # Approved community build; pin the multi-architecture index, not a mutable tag alone.
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address :9001
    env_file: ["${DEPLOY_CONFIG_DIR}/minio.env"]
    volumes:
      - minio-data:/data
      - ../production/minio-healthcheck.sh:/etc/nexus/minio-healthcheck.sh:ro
    networks: [data]
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 128
    logging: *logs
    healthcheck:
      test: [CMD, /bin/sh, /etc/nexus/minio-healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *api
    profiles: [operations]
    env_file: ["${DEPLOY_CONFIG_DIR}/migration.env"]
    command: [alembic, upgrade, head]
    networks: [data]
    depends_on:
      mysql: {condition: service_healthy}

  storage-init:
    <<: *api
    profiles: [operations]
    env_file: ["${DEPLOY_CONFIG_DIR}/storage-init.env"]
    command: [python, /app/deployments/production/bootstrap_minio.py]
    networks: [data]
    depends_on:
      minio: {condition: service_healthy}

  api:
    <<: *api
    env_file: ["${DEPLOY_CONFIG_DIR}/api.env"]
    command: [uvicorn, nexuspilot_api.main:app, --app-dir, src, --host, 0.0.0.0, --port, "8000", --no-proxy-headers]
    networks: [application, data, egress]
    restart: unless-stopped
    stop_grace_period: 140s
    depends_on:
      mysql: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: nexuspilot-web:${RELEASE_TAG}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    env_file: ["${DEPLOY_CONFIG_DIR}/web.env"]
    networks: [edge, application]
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=67108864,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    restart: unless-stopped
    logging: *logs
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.28-alpine
    entrypoint: [/bin/sh, -ec]
    command:
      - 'envsubst ''$$NEXUS_HOST $$PUBLIC_ORIGIN'' < /etc/nexus/site.conf.template > /tmp/site.conf; exec nginx -g ''daemon off;'''
    environment:
      NEXUS_HOST: ${NEXUS_HOST:?Set NEXUS_HOST}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/site.conf.template:/etc/nexus/site.conf.template:ro
      - type: bind
        source: ${TLS_CERTS_DIR:?Set TLS_CERTS_DIR}
        target: /etc/nginx/tls
        read_only: true
        bind: {create_host_path: false}
    networks: [edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    logging: *logs
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge: {}
  application: {internal: true}
  data: {internal: true}
  egress: {}

volumes:
  mysql-data: {}
  minio-data: {}
