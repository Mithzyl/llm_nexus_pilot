# Production ingress. Log paths/status only, never cookies, credentials, query strings or bodies.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format minimal '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout minimal;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=clients:10m;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    include /tmp/site.conf;
}
